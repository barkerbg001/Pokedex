name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel a still-running run for the same branch/PR once a newer one starts
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # Single non-watching run with a coverage report; vitest.config.js
      # fails the run if coverage drops below its thresholds
      - run: npm run test:coverage

      - run: npm run build
