    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Match App.js so the status bar is right before JS loads -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#d4f3fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1419" />
    <script>
      // Apply the saved theme before first paint, so a theme chosen in Settings
      // doesn't flash the OS theme while the app loads. Mirrors App.js (the
      // localStorage key, and the theme-color values per theme).
      (function () {
        try {
          var preference = localStorage.getItem('pokedex-theme') || 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute('content', dark ? '#0f1419' : '#d4f3fb');
          });
        } catch (e) {
          // localStorage can be unavailable; App.js applies the theme once it loads
        }
      })();
    </script>
    <meta
      name="description"
      content="A modern Pokédex web application to browse and search Pokémon"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pokédex" />
    <!-- "default" lets iOS tint the status bar from theme-color (set per theme in App.js) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS still reads this one when deciding to show launch screens -->
